name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  backend-postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Create owner + non-owner app roles
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE owner_role LOGIN PASSWORD 'owner'; CREATE ROLE bachke_app LOGIN PASSWORD 'app';"
          psql -h localhost -U postgres -c "CREATE DATABASE bachke OWNER owner_role;"
          psql -h localhost -U postgres -d bachke -c "GRANT USAGE ON SCHEMA public TO bachke_app; ALTER DEFAULT PRIVILEGES FOR ROLE owner_role IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO bachke_app;"
      - run: alembic upgrade head
        env: { DATABASE_URL: "postgresql+psycopg://owner_role:owner@localhost:5432/bachke" }
      - run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://bachke_app:app@localhost:5432/bachke" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
