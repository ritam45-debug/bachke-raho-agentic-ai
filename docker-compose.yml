# Local full stack: Postgres 16 + API + web. Usage: docker compose up --build  → http://localhost:8080
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: devonly-postgres }
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://owner_role:devonly-owner@db:5432/bachke
      JWT_SECRET: devonly-migrate-secret-not-used-for-tokens-xxxxxxxx
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bachke_app:devonly-app@db:5432/bachke   # non-owner role → RLS enforced
      JWT_SECRET: ${JWT_SECRET:-devonly-change-me-0123456789abcdefghijklmnop}
      CORS_ORIGINS: http://localhost:8080
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes: { pgdata: {} }
